<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var stored = localStorage.getItem("weather-dashboard-theme") || "system";
        var dark =
          stored === "dark" ||
          (stored === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Hyperlocal Weather Dashboard</title>
    <meta name="title" content="Hyperlocal Weather Dashboard" />
    <meta
      name="description"
      content="Search any place or use your location for live weather, hourly and daily forecasts, and an interactive map with precipitation, clouds, wind, and more."
    />
    <meta
      name="keywords"
      content="weather dashboard, hyperlocal weather, hourly forecast, daily forecast, weather map, OpenWeather, MapTiler, React"
    />
    <meta name="author" content="Harsh Pradhan" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://react-tanstack-weather-dashboard.vercel.app/"
    />
    <meta property="og:title" content="Hyperlocal Weather Dashboard" />
    <meta
      property="og:description"
      content="Live conditions, forecasts, and interactive weather layers on a beautiful dark-mode map. Search places or use your current location."
    />
    <meta
      property="og:image"
      content="https://react-tanstack-weather-dashboard.vercel.app/og-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:url"
      content="https://react-tanstack-weather-dashboard.vercel.app/"
    />
    <meta name="twitter:title" content="Hyperlocal Weather Dashboard" />
    <meta
      name="twitter:description"
      content="Live conditions, forecasts, and interactive weather layers on a beautiful dark-mode map. Search places or use your current location."
    />
    <meta
      name="twitter:image"
      content="https://react-tanstack-weather-dashboard.vercel.app/og-preview.png"
    />

    <!-- WhatsApp / additional -->
    <meta property="og:site_name" content="Hyperlocal Weather Dashboard" />
    <meta property="og:locale" content="en_US" />

    <!-- Additional Meta Tags -->
    <meta name="theme-color" content="#12151a" />
    <link
      rel="canonical"
      href="https://react-tanstack-weather-dashboard.vercel.app/"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
